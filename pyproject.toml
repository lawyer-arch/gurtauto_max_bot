[tool.poetry]
name = "gurtauto-max-bot"
version = "0.1.0"
description = "Max bot for car lead generation"
authors = ["Pavel"]
readme = "README.md"
packages = [{ include = "*" }]


[tool.poetry.dependencies]
python = "^3.12"

# Max
maxapi = "^0.9"

# Database
SQLAlchemy = "^2.0"
asyncpg = "^0.29"

# Config
pydantic = "^2.6"
pydantic-settings = "^2.2"

alembic = "^1.13"
psycopg2-binary = "^2.9.11"
psycopg = "^3.3.3"
aiosmtplib = "^5.1.0"

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "watchdog (>=6.0.0,<7.0.0)"
]
